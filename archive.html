<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gorakhpur Archives</title>

<link href="https://fonts.googleapis.com/css2?family=Playwrite+BR:wght@100..400&family=Cormorant+Garamond:ital,wght@0,400;1,500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  background: #ffffff;
  color: #111;
  min-height: 100%;
  font-family: 'Inter', sans-serif;
}

body {
  padding: 48px 56px 100px;
}

/* TITLE */

.hero-title {
  font-family: "Playwrite BR", cursive;
  font-weight: 200;
  font-size: 4.8rem;
  line-height: 1;
  text-align: center;
  margin-bottom: 80px;
}

/* NAV */

nav {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 90px;
}

.nav-left {
  display: flex;
  gap: 36px;
}

.nav-item {
  font-size: 14px;
  cursor: pointer;
  opacity: 0.75;
  transition: opacity 0.2s ease;
}

.nav-item:hover {
  opacity: 1;
}

.about {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 28px;
  cursor: pointer;
}

/* GRID */

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 90px 56px;
}

/* ENTRY */

.entry {
  cursor: pointer;
}

.entry img {
  width: 100%;
  max-width: 145px;
  margin-bottom: 20px;
  transition: transform 0.25s ease, opacity 0.25s ease;
}

.entry:hover img {
  transform: translateY(-4px);
  opacity: 0.75;
}

.year {
  font-size: 11px;
  opacity: 0.45;
  margin-bottom: 8px;
}

.title {
  font-size: 14px;
  line-height: 1.5;
  max-width: 180px;
}

.tag {
  margin-top: 8px;
  font-size: 11px;
  opacity: 0.4;
  font-style: italic;
}

/* RESPONSIVE */

@media (max-width: 1100px) {
  .grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (max-width: 760px) {
  body {
    padding: 32px;
  }

  .grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 60px 36px;
  }

  .hero-title {
    font-size: 3rem;
  }
}
</style>
</head>
<body>

<div class="hero-title">Welcome to Gorakhpur</div>

<nav>
  <div class="nav-left">
    <div class="nav-item">history</div>
    <div class="nav-item">culture</div>
    <div class="nav-item">ecosystem</div>
  </div>

  <div class="about">about</div>
</nav>

<div class="grid">

  <div class="entry">
    <img src="Group 1.svg" alt="">
    <div class="year">1556–1605</div>
    <div class="title">Copper coin minted in Gorakhpur district under Akbar’s rule</div>
  </div>

  <div class="entry">
    <img src="entry2.svg" alt="">
    <div class="year">1947</div>
    <div class="title">Rapti Riverbank</div>
    <div class="tag">oral history</div>
  </div>

  <div class="entry">
    <img src="entry3.svg" alt="">
    <div class="year">1962</div>
    <div class="title">Temple Fair</div>
    <div class="tag">ritual</div>
  </div>

  <div class="entry">
    <img src="entry4.svg" alt="">
    <div class="year">1975</div>
    <div class="title">Flood Season</div>
    <div class="tag">climate</div>
  </div>

  <div class="entry">
    <img src="entry5.svg" alt="">
    <div class="year">1984</div>
    <div class="title">Weaver’s Quarter</div>
    <div class="tag">craft</div>
  </div>

  <div class="entry">
    <img src="entry6.svg" alt="">
    <div class="year">1991</div>
    <div class="title">Cinema Halls</div>
    <div class="tag">memory</div>
  </div>

</div>

</body>
</html>
