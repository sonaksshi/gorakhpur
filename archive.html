<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gorakhpur archives</title>

<link href="https://fonts.googleapis.com/css2?family=Playwrite+BR:wght@300;400&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  background: #fff;
  color: #111;
  min-height: 100%;
  font-family: Arial, sans-serif;
}

body {
  padding: 42px 56px 80px;
}

/* NAV */

nav {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 90px;
}

.nav-left {
  display: flex;
  gap: 23px;
}

.nav-item,
.about {
  font-family: "Playwrite BR", cursive;
  font-size: 16px;
  font-weight: 300;
  cursor: pointer;
  opacity: 0.9;
  transition: opacity 0.25s ease;
}

.nav-item:hover,
.about:hover {
  opacity: 0.45;
}

/* GRID */

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  column-gap: 40px;
  row-gap: 40px;
}

/* ENTRY */

.entry {
  cursor: pointer;
}

.entry img {
  width: 100%;
  max-width: 80px;
  margin-bottom: 9px;
  transition: transform 0.25s ease, opacity 0.25s ease;
}

.entry:hover img {
  transform: translateY(-5px);
  opacity: 0.72;
}

.year {
  font-size: 8px;
  opacity: 0.45;
  margin-bottom: 3px;
  letter-spacing: 0.03em;
}

.title {
  font-size: 11px;
  line-height: 1.4;
  max-width: 150px;
}

.tag {
  margin-top: 3px;
  font-size: 8px;
  opacity: 0.35;
  font-style: italic;
}

@media (max-width: 1100px) {
  .grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (max-width: 760px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
  }

  body {
    padding: 14px;
  }

  .nav-item,
  .about {
    font-size: 12px;
  }
}
</style>
</head>
<body>

<nav>
  <div class="nav-left">
    <div class="nav-item">history</div>
    <div class="nav-item">culture</div>
    <div class="nav-item">ecosystem</div>
  </div>

  <div class="about">about</div>
</nav>

<div class="grid">

  <div class="entry">
    <img src="Group 1.svg" alt="">
    <div class="year">1556–1605</div>
    <div class="title">Copper coin minted in Gorakhpur district under Akbar's rule</div>
  </div>

  <div class="entry">
    <img src="entry2.svg" alt="">
    <div class="year">1947</div>
    <div class="title">Rapti Riverbank</div>
    <div class="tag">oral history</div>
  </div>

  <div class="entry">
    <img src="entry3.svg" alt="">
    <div class="year">1962</div>
    <div class="title">Temple Fair</div>
    <div class="tag">ritual</div>
  </div>

  <div class="entry">
    <img src="entry4.svg" alt="">
    <div class="year">1975</div>
    <div class="title">Flood Season</div>
    <div class="tag">climate</div>
  </div>

</div>

</body>
</html>
