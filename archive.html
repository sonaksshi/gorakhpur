<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gorakhpur archives</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  background: #fff;
  color: #111;
  font-family: 'IBM Plex Sans', sans-serif;
  min-height: 100%;
}

body {
  padding: 42px 56px 80px;
}

/* NAV */

nav {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 72px;
}

.nav-left {
  display: flex;
  gap: 34px;
}

.nav-item {
  font-size: 14px;
  font-weight: 400;
  cursor: pointer;
  opacity: 0.85;
  transition: opacity 0.2s ease;
}

.nav-item:hover {
  opacity: 0.45;
}

.about {
  font-family: 'Cormorant Garamond', serif;
  font-size: 30px;
  font-style: italic;
  cursor: pointer;
}

/* GRID */

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  column-gap: 56px;
  row-gap: 84px;
}

/* ENTRY */

.entry {
  cursor: pointer;
}

.entry img {
  width: 100%;
  max-width: 150px;
  margin-bottom: 18px;
  transition: transform 0.25s ease, opacity 0.25s ease;
}

.entry:hover img {
  transform: translateY(-4px);
  opacity: 0.72;
}

.year {
  font-size: 11px;
  opacity: 0.45;
  margin-bottom: 6px;
}

.title {
  font-size: 14px;
  line-height: 1.45;
  max-width: 170px;
  font-weight: 400;
}

.tag {
  margin-top: 7px;
  font-size: 11px;
  opacity: 0.4;
  font-style: italic;
}

/* RESPONSIVE */

@media (max-width: 1100px) {
  .grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (max-width: 760px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
  }

  body {
    padding: 28px;
  }
}
</style>
</head>
<body>

<nav>
  <div class="nav-left">
    <div class="nav-item">history</div>
    <div class="nav-item">culture</div>
    <div class="nav-item">ecosystem</div>
  </div>

  <div class="about">about</div>
</nav>

<div class="grid">

  <div class="entry">
    <img src="Group 1.svg" alt="">
    <div class="year">1923</div>
    <div class="title">Akbar's Mint in Gorakhpur</div>
  </div>

  <div class="entry">
    <img src="entry2.svg" alt="">
    <div class="year">1947</div>
    <div class="title">Rapti Riverbank</div>
    <div class="tag">oral history</div>
  </div>

  <div class="entry">
    <img src="entry3.svg" alt="">
    <div class="year">1962</div>
    <div class="title">Temple Fair</div>
    <div class="tag">ritual</div>
  </div>

  <div class="entry">
    <img src="entry4.svg" alt="">
    <div class="year">1975</div>
    <div class="title">Flood Season</div>
    <div class="tag">climate</div>
  </div>

  <div class="entry">
    <img src="entry5.svg" alt="">
    <div class="year">1984</div>
    <div class="title">Weaver's Quarter</div>
    <div class="tag">craft</div>
  </div>

  <div class="entry">
    <img src="entry6.svg" alt="">
    <div class="year">1991</div>
    <div class="title">Cinema Halls</div>
    <div class="tag">memory</div>
  </div>

</div>

</body>
</html>
