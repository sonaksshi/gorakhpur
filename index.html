<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gorakhpur</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      font-family: sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .landing-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 42px;
    }

    .text-block img {
      display: block;
      max-width: 520px;
      width: auto;
      height: auto;
    }

    .clickable {
      cursor: pointer;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .clickable:hover {
      transform: translateY(-4px);
      opacity: 0.75;
    }
  </style>
</head>
<body>

  <div class="landing-center">

    <div class="text-block">
      <img src="GP_E.svg" alt="">
    </div>

    <div class="text-block">
      <img src="GP_H.svg" alt="">
    </div>

    <div class="text-block clickable" id="portal-btn">
      <img src="GP_U.svg" alt="">
    </div>

  </div>

  <script>
    document.getElementById("portal-btn").addEventListener("click", function () {
      alert("Link your next page here.");
      // Example:
      // window.location.href = "archive.html";
    });
  </script>

</body>
</html>
