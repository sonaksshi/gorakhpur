<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Gorakhpur</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
html,
body {
  width: 100%;
  min-height: 100%;
  background: #ffffff;
  font-family: sans-serif;
  overflow-x: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;

  min-height: 100vh;

  padding: 40px 24px;
}

.landing-center {
  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 46px;

  width: 100%;
}

.text-block {
  display: flex;
  justify-content: center;

  width: 100%;
}

.text-block img {
  display: block;

  width: 100%;
  max-width: 560px;

  height: auto;
  object-fit: contain;
}

.clickable {
  cursor: pointer;

  transition:
    opacity 0.25s ease,
    transform 0.25s ease;
}

.clickable:hover {
  opacity: 0.78;
  transform: translateY(-3px);
}

/* MOBILE */

@media (max-width: 760px) {

  body {
    padding: 24px 18px;
  }

  .landing-center {
    gap: 54px;

    min-height: 100vh;
    justify-content: center;
  }

  .text-block img {
    max-width: 100%;
  }
}
  </style>
</head>

<body>

  <div class="landing-center">

    <div class="text-block clickable"
         onclick="window.location.href='archive.html'">
      <img src="GP_E.svg" alt="Welcome in English">
    </div>

    <div class="text-block clickable"
         onclick="window.location.href='archive.html'">
      <img src="GP_H.svg" alt="Welcome in Hindi">
    </div>

    <div class="text-block clickable"
         onclick="window.location.href='archive.html'">
      <img src="GP_U.svg" alt="Welcome in Urdu">
    </div>

  </div>

</body>
</html>
