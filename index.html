<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Gorakhpur</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #ffffff;
      font-family: sans-serif;
      overflow-x: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    /* ENTIRE LANDING CLICKABLE */

    .landing-link {
      text-decoration: none;
      color: inherit;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 42px;
      width: 100%;

      cursor: pointer;

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .landing-link:hover {
      opacity: 0.82;
      transform: translateY(-3px);
    }

    .text-block {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .text-block img {
      display: block;
      width: 100%;
      max-width: 560px;
      height: auto;
      object-fit: contain;
    }

    /* MOBILE */

    @media (max-width: 760px) {

      body {
        padding: 32px 18px;
      }

      .landing-link {
        gap: 54px;
      }

      .text-block img {
        max-width: 100%;
      }
    }

  </style>
</head>

<body>

  <a href="archive.html" class="landing-link">

    <div class="text-block">
      <img src="GP_E.svg" alt="Welcome to Gorakhpur in English">
    </div>

    <div class="text-block">
      <img src="GP_H.svg" alt="Welcome to Gorakhpur in Hindi">
    </div>

    <div class="text-block">
      <img src="GP_U.svg" alt="Welcome to Gorakhpur in Urdu">
    </div>

  </a>

</body>
</html>
