<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gorakhpur</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      font-family: sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .landing-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 42px;
    }

    .text-block img {
      display: block;
      max-width: 520px;
      width: auto;
      height: auto;
    }

    .clickable {
      cursor: pointer;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .clickable:hover {
      transform: translateY(-4px);
      opacity: 0.75;
    }
    body::before,
body::after {
  content: "";
  position: fixed;
  left: 0;
  width: 100%;
  height: 12px;
  background-image: url("471f698a4fcc1d7a7ad2ae0e39a8ce22 1.svg");
  background-repeat: repeat-x;
  background-size: auto 12px;
  filter: grayscale(100%) contrast(180%) brightness(0.45);
  opacity: 0.35;
  z-index: 9999;
  pointer-events: none;
}

body::before {
  top: 0;
}

body::after {
  bottom: 0;
}

html::before,
html::after {
  content: "";
  position: fixed;
  top: 0;
  height: 100%;
  width: 12px;
  background-image: url("vertical 1.svg");
  background-repeat: repeat-y;
  background-size: 12px auto;
  filter: grayscale(100%) contrast(180%) brightness(0.45);
  opacity: 0.35;
  z-index: 9999;
  pointer-events: none;
}

html::before {
  left: 0;
}

html::after {
  right: 0;
}
  </style>
</head>
<body>

  <div class="landing-center">

    <div class="text-block">
      <img src="GP_E.svg" alt="">
    </div>

    <div class="text-block">
      <img src="GP_H.svg" alt="">
    </div>

    <div class="text-block clickable" id="portal-btn">
      <img src="GP_U.svg" alt="">
    </div>

  </div>

  <script>
    document.getElementById("portal-btn").addEventListener("click", function () {
    window.location.href = "archive.html";
    });
  </script>

</body>
</html>
